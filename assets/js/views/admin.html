<section>

    <!-- ======= TOP ROW: Stats + Técnicos ======= -->
    <div class="row g-4 mb-4">

        <!-- LEFT: Título + Stats + Crear -->
        <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h4 class="fw-bold mb-0">
                        <i class="bi bi-shield-check text-danger me-2"></i>Panel Admin
                    </h4>
                    <span class="text-muted small">Gestión completa del sistema</span>
                </div>
                <button id="btnNuevoTicket" class="btn btn-danger fw-semibold">
                    <i class="bi bi-plus-lg me-1"></i>Crear Ticket
                </button>
            </div>

            <!-- Stats grid -->
            <div class="row g-2" id="adminStats"></div>
        </div>

        <!-- RIGHT: Técnicos Disponibles -->
        <div class="col-lg-5">
            <div class="tech-panel h-100">
                <div class="tech-panel-title">
                    <i class="bi bi-people-fill me-2"></i>Técnicos Disponibles
                </div>
                <div class="tech-cards-grid" id="techCardsGrid">
                    <div class="text-center text-muted small py-3">
                        <div class="spinner-border spinner-border-sm"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======= FILTERS ======= -->
    <div class="filter-bar mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-12 col-sm-4">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchInput"
                        placeholder="Nombre o descripción...">
                </div>
            </div>
            <div class="col-6 col-sm-3">
                <select class="form-select form-select-sm" id="filterEstado">
                    <option value="">Todos los estados</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="en proceso">En proceso</option>
                    <option value="asignado">Asignado</option>
                    <option value="solucionado">Solucionado</option>
                </select>
            </div>
            <div class="col-6 col-sm-3">
                <select class="form-select form-select-sm" id="filterTipo">
                    <option value="">Todos los tipos</option>
                    <option value="incidente">Incidente</option>
                    <option value="requerimiento">Requerimiento</option>
                    <option value="soporte">Soporte</option>
                </select>
            </div>
            <div class="col-12 col-sm-2">
                <button class="btn btn-outline-secondary btn-sm w-100" id="btnLimpiarFiltros">
                    <i class="bi bi-x-circle me-1"></i>Limpiar
                </button>
            </div>
        </div>
    </div>

    <!-- ======= TICKETS GRID ======= -->
    <div class="tickets-section-title mb-3">
        <i class="bi bi-ticket-detailed me-2"></i>Todos los Tickets
        <span class="tickets-count" id="ticketsCount"></span>
    </div>

    <div id="adminTicketsList">
        <div class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2 text-muted small">Cargando tickets...</p>
        </div>
    </div>

</section>

<!-- ======= MODAL: Crear / Editar Ticket ======= -->
<div class="modal fade" id="ticketModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold" id="modalTitle">
                    <i class="bi bi-ticket me-2"></i>Ticket
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="modalAlert" class="alert d-none"></div>
                <input type="hidden" id="ticketId">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold small">Nombre del ticket <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-sm" id="ticketNombre"
                            placeholder="Ej: Error en servidor">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Tipo <span class="text-danger">*</span></label>
                        <select class="form-select form-select-sm" id="ticketTipo">
                            <option value="">Seleccionar...</option>
                            <option value="incidente">Incidente</option>
                            <option value="requerimiento">Requerimiento</option>
                            <option value="soporte">Soporte</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold small">Descripción <span class="text-danger">*</span></label>
                        <textarea class="form-control form-control-sm" id="ticketDescripcion" rows="3"
                            placeholder="Describe el problema..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Técnico asignado</label>
                        <select class="form-select form-select-sm" id="ticketTecnico">
                            <option value="">Sin asignar</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Estado</label>
                        <select class="form-select form-select-sm" id="ticketEstado">
                            <option value="pendiente">Pendiente</option>
                            <option value="en proceso">En proceso</option>
                            <option value="asignado">Asignado</option>
                            <option value="solucionado">Solucionado</option>
                        </select>
                        <div class="form-text text-warning small mt-1" id="estadoWarning" style="display:none">
                            <i class="bi bi-exclamation-triangle"></i>
                            "Asignado" requiere seleccionar un técnico.
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-sm btn-danger fw-semibold" id="btnGuardarTicket">
                    <i class="bi bi-check-lg me-1"></i>Guardar
                </button>
            </div>
        </div>
    </div>
</div>
