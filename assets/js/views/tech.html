<section>
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-tools text-primary me-2"></i>Panel de Técnico
            </h2>
            <p class="text-muted small mb-0">Gestiona tus tickets asignados</p>
        </div>
        <button id="btnNuevoTicket" class="btn btn-primary fw-semibold">
            <i class="bi bi-plus-circle me-1"></i> Nuevo Ticket
        </button>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4" id="techStats"></div>

    <!-- Tickets List -->
     <div class="tickets-section-title mb-3">
        <i class="bi bi-ticket-detailed me-2"></i>Mis Tickets Asignados
        <span class="tickets-count" id="ticketsCount"></span>
    </div>
    <div id="techTicketsList">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando tus tickets...</p>
        </div>
    </div>
</section>

<!-- Modal: Crear/Editar Ticket Técnico -->
<div class="modal fade" id="techTicketModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="techModalTitle">
                    <i class="bi bi-ticket me-2"></i>Ticket
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="techModalAlert" class="alert d-none"></div>
                <input type="hidden" id="techTicketId">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Nombre del ticket <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="techTicketNombre" placeholder="Ej: Fallo en red">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Tipo <span class="text-danger">*</span></label>
                        <select class="form-select" id="techTicketTipo">
                            <option value="">Seleccionar...</option>
                            <option value="incidente">Incidente</option>
                            <option value="requerimiento">Requerimiento</option>
                            <option value="soporte">Soporte</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Descripción <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="techTicketDescripcion" rows="3"
                            placeholder="Describe el problema..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estado</label>
                        <select class="form-select" id="techTicketEstado">
                            <option value="en proceso">En proceso</option>
                            <option value="asignado">Asignado</option>
                            <option value="solucionado">Solucionado</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <div class="alert alert-info small mb-0 mt-md-4">
                            <i class="bi bi-info-circle me-1"></i>
                            El ticket se asignará automáticamente a ti.
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary fw-semibold" id="btnGuardarTechTicket">
                    <i class="bi bi-check-lg me-1"></i>Guardar
                </button>
            </div>
        </div>
    </div>
</div>
