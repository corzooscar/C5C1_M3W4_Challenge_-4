<section>
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-person-check text-success me-2"></i>Mis Tickets
            </h2>
            <p class="text-muted small mb-0">Historial de tus solicitudes de soporte</p>
        </div>
        <button id="btnNuevoTicket" class="btn btn-success fw-semibold">
            <i class="bi bi-plus-circle me-1"></i> Nueva Solicitud
        </button>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4" id="clientStats"></div>

    <!-- Tickets List -->
    <div class="tickets-section-title mb-3">
        <i class="bi bi-ticket-detailed me-2"></i>Todos mis Tickets
        <span class="tickets-count" id="ticketsCount"></span>
    </div>
    <div id="clientTicketsList">
        <div class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted">Cargando tus tickets...</p>
        </div>
    </div>
</section>

<!-- Modal: Crear/Editar Ticket Cliente -->
<div class="modal fade" id="clientTicketModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold" id="clientModalTitle">
                    <i class="bi bi-ticket me-2"></i>Nueva Solicitud
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="clientModalAlert" class="alert d-none"></div>
                <input type="hidden" id="clientTicketId">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Nombre del ticket <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="clientTicketNombre"
                            placeholder="Ej: Pantalla no enciende">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Tipo <span class="text-danger">*</span></label>
                        <select class="form-select" id="clientTicketTipo">
                            <option value="">Seleccionar...</option>
                            <option value="incidente">Incidente</option>
                            <option value="requerimiento">Requerimiento</option>
                            <option value="soporte">Soporte</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Descripción del problema <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="clientTicketDescripcion" rows="4"
                            placeholder="Describe con detalle el problema o lo que necesitas..."></textarea>
                    </div>
                    <div class="col-12">
                        <div class="alert alert-info small mb-0">
                            <i class="bi bi-info-circle me-1"></i>
                            Un administrador revisará tu solicitud y asignará un técnico disponible.
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success fw-semibold" id="btnGuardarClientTicket">
                    <i class="bi bi-send me-1"></i>Enviar Solicitud
                </button>
            </div>
        </div>
    </div>
</div>
